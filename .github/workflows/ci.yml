name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Run tests
        run: cargo test --workspace --all-targets

  wasm:
    name: Wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Build wasm crate for wasm32-unknown-unknown
        run: cargo build -p wasm --target wasm32-unknown-unknown

  # Not a publish step - assembles the @studiolavalse/music-xml package
  # locally (scripts/build-wasm.sh + scripts/stage-package.sh) and runs
  # `npm pack --dry-run` as a smoke test, so a broken relative asset path or
  # an oversized bundle surfaces on every PR instead of at actual publish
  # time. See packaging/package.json for the (still unpublished) draft
  # manifest.
  package:
    name: Package (dry run)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0
      - name: Build wasm bindings
        run: ./scripts/build-wasm.sh
      # wasm-bindgen copies Rust doc comments into the generated JSDoc, so a
      # `*/` inside one closes the comment early and leaves wasm.js
      # syntactically invalid. Nothing else in CI parses that file.
      - name: Check generated wasm.js parses
        run: node --check wasm/pkg/wasm.js
      - name: Stage package
        run: ./scripts/stage-package.sh
      - name: npm pack (dry run, no publish)
        working-directory: dist/npm
        run: npm pack --dry-run
