<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>&lt;music-xml&gt; component test</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 1.5rem;
    }

    h1 {
      margin-top: 0;
    }

    form {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem 1rem;
      max-width: 40rem;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    input[type="color"] {
      justify-self: start;
      width: 3rem;
      height: 2rem;
      padding: 0;
      border: 1px solid #ccc;
    }

    .scores {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      align-items: flex-start;
    }

    .scores figure {
      margin: 0;
      border: 1px solid #ccc;
      overflow: auto;
      flex: 1 1 20rem;
      min-width: 0;
    }

    .scores figcaption {
      padding: 0.25rem 0.5rem;
      font-size: 0.85rem;
      background: #f5f5f5;
      border-bottom: 1px solid #ccc;
    }

    music-xml {
      display: block;
    }

    #right {
      --page-color: #fff7e6;
      --foreground-color: #442200;
    }
  </style>
</head>
<body>
  <h1>&lt;music-xml&gt; component test</h1>
  <p>
    Two independent <code>&lt;music-xml&gt;</code> elements below: the left one is
    driven by the form (proving attributes react live), the right one is static
    (proving the two don't share state).
  </p>

  <form id="settings-form">
    <label for="page-color">Page color</label>
    <input type="color" id="page-color" value="#ffffff" />

    <label for="foreground-color">Foreground color</label>
    <input type="color" id="foreground-color" value="#000000" />

    <label for="page-orientation">Page orientation</label>
    <select id="page-orientation">
      <option value="">(default)</option>
      <option value="horizontal">Horizontal</option>
      <option value="vertical">Vertical</option>
    </select>

    <label for="horizontal-gutter-even">Horizontal gutter (even)</label>
    <input type="number" id="horizontal-gutter-even" step="any" />

    <label for="horizontal-gutter-uneven">Horizontal gutter (uneven)</label>
    <input type="number" id="horizontal-gutter-uneven" step="any" />

    <label for="vertical-gutter">Vertical gutter</label>
    <input type="number" id="vertical-gutter" step="any" />

    <label for="section-symbol">Section symbol</label>
    <select id="section-symbol">
      <option value="">(from document)</option>
      <option value="none">None</option>
      <option value="brace">Brace</option>
      <option value="bracket">Bracket</option>
      <option value="line">Line</option>
      <option value="square">Square</option>
    </select>

    <label for="part-group-symbol">Part-group symbol</label>
    <select id="part-group-symbol">
      <option value="">(from document)</option>
      <option value="none">None</option>
      <option value="brace">Brace</option>
      <option value="bracket">Bracket</option>
      <option value="line">Line</option>
      <option value="square">Square</option>
    </select>

    <label for="part-symbol">Part symbol</label>
    <select id="part-symbol">
      <option value="">(default)</option>
      <option value="none">None</option>
      <option value="brace">Brace</option>
      <option value="bracket">Bracket</option>
      <option value="line">Line</option>
      <option value="square">Square</option>
    </select>

    <label for="section-symbol-gap">Section symbol gap</label>
    <input type="number" id="section-symbol-gap" step="any" />

    <label for="part-group-symbol-gap">Part-group symbol gap</label>
    <input type="number" id="part-group-symbol-gap" step="any" />

    <label for="part-symbol-gap">Part symbol gap</label>
    <input type="number" id="part-symbol-gap" step="any" />

    <label for="group-bracket-thickness">Bracket thickness</label>
    <input type="number" id="group-bracket-thickness" step="any" />

    <label for="group-line-thickness">Line thickness</label>
    <input type="number" id="group-line-thickness" step="any" />

    <label for="group-square-thickness">Square thickness</label>
    <input type="number" id="group-square-thickness" step="any" />

    <label for="group-square-arm">Square arm length</label>
    <input type="number" id="group-square-arm" step="any" />

    <label for="group-name-size">Group name size</label>
    <input type="number" id="group-name-size" step="any" />

    <label for="group-name-padding">Group name padding</label>
    <input type="number" id="group-name-padding" step="any" />

    <label for="debug">Debug overlay</label>
    <input type="checkbox" id="debug" />
  </form>

  <div class="scores">
    <figure>
      <figcaption>left (form-controlled)</figcaption>
      <music-xml
        id="left"
        file="../xmlsamples/ActorPreludeSample.musicxml"
        style="--page-color: #ffffff; --foreground-color: #000000;"
      ></music-xml>
    </figure>
    <figure>
      <figcaption>right (static)</figcaption>
      <music-xml id="right" file="../xmlsamples/BrahWiMeSample.musicxml"></music-xml>
    </figure>
  </div>

  <script type="module">
    import "../../web/music-xml.js";

    const left = document.getElementById("left");
    const right = document.getElementById("right");

    left.addEventListener("load", () => console.log("[left] loaded"));
    left.addEventListener("error", (e) => console.error("[left] error", e.detail));
    right.addEventListener("load", () => console.log("[right] loaded"));
    right.addEventListener("error", (e) => console.error("[right] error", e.detail));

    const cssVarIds = [
      "page-color",
      "foreground-color",
      "page-orientation",
      "horizontal-gutter-even",
      "horizontal-gutter-uneven",
      "vertical-gutter",
      "section-symbol",
      "part-group-symbol",
      "part-symbol",
      "section-symbol-gap",
      "part-group-symbol-gap",
      "part-symbol-gap",
      "group-bracket-thickness",
      "group-line-thickness",
      "group-square-thickness",
      "group-square-arm",
      "group-name-size",
      "group-name-padding",
    ];

    for (const id of cssVarIds) {
      const input = document.getElementById(id);
      input.addEventListener("input", () => {
        if (input.value === "") {
          left.style.removeProperty(`--${id}`);
        } else {
          left.style.setProperty(`--${id}`, input.value);
        }
      });
    }

    document.getElementById("debug").addEventListener("change", (e) => {
      left.toggleAttribute("debug", e.target.checked);
    });
  </script>
</body>
</html>
