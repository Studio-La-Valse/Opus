<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Opus — wasm viewer</title>
  <style>
    @font-face {
      font-family: "Bravura";
      src: url("../smufl/bravura-bravura-1.392/redist/woff/Bravura.woff2") format("woff2"),
           url("../smufl/bravura-bravura-1.392/redist/woff/Bravura.woff") format("woff");
    }

    body {
      font-family: sans-serif;
      margin: 1.5rem;
    }

    form {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.5rem 1rem;
      max-width: 40rem;
      align-items: center;
    }

    #status {
      margin: 1rem 0;
      color: #a00;
      white-space: pre-wrap;
    }

    #output {
      border: 1px solid #ccc;
      overflow: auto;
      max-width: 100%;
    }

    #output svg {
      max-width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <h1>Opus — wasm viewer</h1>

  <form id="render-form">
    <label for="musicxml-file">MusicXML file</label>
    <input type="file" id="musicxml-file" accept=".musicxml,.xml" required />

    <label for="page-color">Page color</label>
    <input type="text" id="page-color" placeholder="#FFFFFF" />

    <label for="foreground-color">Foreground color</label>
    <input type="text" id="foreground-color" placeholder="#000000" />

    <label for="page-orientation">Page orientation</label>
    <select id="page-orientation">
      <option value="">(default)</option>
      <option value="horizontal">Horizontal</option>
      <option value="vertical">Vertical</option>
    </select>

    <label for="horizontal-gutter-even">Horizontal gutter (even)</label>
    <input type="number" id="horizontal-gutter-even" step="any" />

    <label for="horizontal-gutter-uneven">Horizontal gutter (uneven)</label>
    <input type="number" id="horizontal-gutter-uneven" step="any" />

    <label for="vertical-gutter">Vertical gutter</label>
    <input type="number" id="vertical-gutter" step="any" />

    <label for="debug">Debug overlay</label>
    <input type="checkbox" id="debug" />

    <span></span>
    <button type="submit" id="render-button" disabled>Loading wasm module…</button>
  </form>

  <div id="status"></div>
  <div id="output"></div>

  <script type="module" src="./main.js"></script>
</body>
</html>
