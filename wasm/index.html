<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wasm MusicXML Viewer</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #fafafa; }
        #canvas { border: 1px solid #ccc; background: white; margin-top: 20px; }
        .status { color: #666; font-style: italic; margin-top: 5px; }
    </style>
</head>
<body>

<h1>MusicXML Layout Engine</h1>

<input type="file" id="file-input" accept=".musicxml,.xml" disabled />
<div id="status" class="status">Loading WebAssembly module...</div>

<canvas id="canvas" width="800" height="600"></canvas>

<script type="module">
    // Import your wasm-bindgen generated glue code
    // Adjust the path './pkg/your_crate_name.js' to match your actual build output directory
    import init, { load_xml, compute_layout, export_elements } from './pkg/wasm.js';

    let wasmMemory;

    async function start() {
        try {
            // Initialize the WASM module and capture the raw memory instance
            const wasm = await init();
            wasmMemory = wasm.memory;

            document.getElementById('status').innerText = "Wasm loaded! Choose a .musicxml file.";
            document.getElementById('file-input').disabled = false;
        } catch (err) {
            document.getElementById('status').innerText = "Error loading Wasm: " + err.message;
            console.error(err);
        }
    }

    // Handle file loading
    document.getElementById('file-input').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const xmlText = e.target.result;
            processMusicXML(xmlText);
        };
        reader.readAsText(file);
    });

    function processMusicXML(xmlString) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerText = "Processing layout...";

        // 1. Pass XML string to Rust (stores it in thread_local)
        load_xml(xmlString);

        // 2. Compute the visual scores and arrangements
        compute_layout();

        // 3. Export elements from Rust
        const elements = export_elements();

        statusDiv.innerText = `Layout loaded successfully! Byte length: ${elements.length}.`;

        // 5. Pass it over to your drawing system!
        drawVisualToCanvas(elements);
    }

    function drawVisualToCanvas(elements) {
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // Clear canvas for a fresh draw
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (const el of elements) {
            switch (el.type) {
                case "rect":
                    ctx.
            }
        }
    }

    // Boot everything up
    start();
</script>
</body>
</html>
